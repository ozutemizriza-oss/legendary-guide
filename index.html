        let userAnswers = {};

        function renderQuestions() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = "";

            questionsData.forEach((q, index) => {
                const questionHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div class="flex items-center gap-2 mb-4">
                            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-0.5 rounded">${q.topic}</span>
                            <span class="text-gray-400 text-sm font-medium">Soru ${index + 1}</span>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">${q.question}</h3>
                        <div class="space-y-3">
                            ${q.options.map((opt, optIndex) => `
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-indigo-50 transition peer-checked:bg-indigo-50 peer-checked:border-indigo-500">
                                    <input type="radio" name="q${q.id}" value="${optIndex}" onchange="selectAnswer(${q.id}, ${optIndex})" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                                    <span class="ml-3 text-gray-700">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.innerHTML += questionHTML;
            });
        }

        function selectAnswer(questionId, optionIndex) {
            userAnswers[questionId] = optionIndex;
        }

        function finishQuiz() {
            const studentName = document.getElementById("studentName").value;
            if (!studentName) {
                alert("Lütfen önce adını soyadını yaz!");
                return;
            }

            const btn = document.getElementById("submitBtn");
            btn.innerHTML = "Sonuçlar Gönderiliyor...";
            btn.disabled = true;

            let score = 0;
            let wrongQuestions = [];

            questionsData.forEach(q => {
                if (userAnswers[q.id] === q.correct) {
                    score++;
                } else {
                    const userAnswerText = userAnswers[q.id] !== undefined ? q.options[userAnswers[q.id]] : "Boş";
                    wrongQuestions.push(`Soru ${q.id} (${q.topic}): Cevabın '${userAnswerText}', Doğrusu '${q.options[q.correct]}'`);
                }
            });

            // E-posta Gönderimi için Formspree Kullanımı
            // DİKKAT: "YOUR_FORMSPREE_ENDPOINT" yazan yeri kendi linkinle değiştirmelisin.
            const formspreeEndpoint = "https://formspree.io/f/mgaoakgk";

            const emailData = {
                Ogrenci_Adi: studentName,
                Dogru_Sayisi: score,
                Yanlis_Bos_Sayisi: questionsData.length - score,
                Toplam_Soru: questionsData.length,
                Hata_Detaylari: wrongQuestions.length > 0 ? wrongQuestions.join(" | ") : "Hepsi Doğru!"
            };

            fetch(formspreeEndpoint, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(emailData)
            })
            .then(response => {
                showModal(score, questionsData.length);
            })
            .catch(error => {
                alert("Bir hata oluştu, lütfen Rıza Hoca'ya haber ver.");
                btn.innerHTML = "Tekrar Dene";
                btn.disabled = false;
            });
        }

        function showModal(score, total) {
            document.getElementById("resultText").innerHTML = `${total} soruda <strong>${score} doğru</strong> yaptın.`;
            const modal = document.getElementById("resultModal");
            modal.classList.remove("hidden");
        }

        function closeModal() {
            window.location.reload();
        }

        // Sayfa yüklendiğinde soruları bas
        window.onload = renderQuestions;
